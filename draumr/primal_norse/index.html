<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Primal Norse | Ritual Focus</title>
    
    <!-- Fonts: Cinzel (Headers) and Raleway (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Raleway:wght@300;400;600&display=swap" rel="stylesheet">
    
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- VIDEO CONTAINER -->
    <div id="video-container">
        <!-- Two video players for buffering strategy -->
        <video id="v1" class="bg-video" muted playsinline></video>
        <video id="v2" class="bg-video" muted playsinline></video>
    </div>

    <!-- OVERLAYS -->
    <div class="vignette"></div>
    <div class="noise-overlay"></div>

    <!-- CONTENT -->
    <div class="content-layer">
        <h1>Primal Norse</h1>
        <h2>The Body & The Spirit</h2>
        
        <p>
            A visceral, rhythmic-centric reconstruction. 
            Unlike Folk, which demands active listening, this is 
            functional utility music designed to induce a specific state: 
            Trance. Adrenaline. Ritual Focus.
        </p>

        <a href="#" class="btn-trance">Enter The Shield Wall</a>

        <div class="status-text" id="status-display">Initializing Sequence...</div>
    </div>

    <!-- External JS -->
    <script src="script.js"></script>
</body>
</html>
